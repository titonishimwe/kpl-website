{% extends "base.html" %}

{% block title %}Log In - Kigali Public Library{% endblock %}

{% block content %}
<section class="py-5 bg-light my-auto">
  <div class="container-xxl py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <h2 class="fs-2 fw-bold tracking-tight mb-2">Member Sign In</h2>
            <div class="section-accent-line"></div>
            <p class="text-muted small">Sign in to manage your library membership and reservations.</p>
          </div>

          <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control py-2" id="id_username" required placeholder="Your username">
            </div>

            <div class="mb-4">
              <label for="id_password" class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control py-2" id="id_password" required placeholder="Your password">
            </div>

            <div class="d-grid mb-4">
              <button type="submit" class="btn btn-kpl-primary py-3">Sign In</button>
            </div>

            <div class="text-center text-muted small">
              Don't have an account yet? <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none">Register here</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

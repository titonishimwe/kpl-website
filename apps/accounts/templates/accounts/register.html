{% extends "base.html" %}

{% block title %}Create Account - Kigali Public Library{% endblock %}

{% block content %}
<section class="py-5 bg-light my-auto">
  <div class="container-xxl py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <h2 class="fs-2 fw-bold tracking-tight mb-2">Create Account</h2>
            <div class="section-accent-line"></div>
            <p class="text-muted small">Join Kigali Public Library to access resources and event bookings.</p>
          </div>

          <form method="post" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">First Name *</label>
                <input type="text" name="first_name" class="form-control" required placeholder="First name">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Last Name *</label>
                <input type="text" name="last_name" class="form-control" required placeholder="Last name">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Username *</label>
                <input type="text" name="username" class="form-control" required placeholder="Choose a username">
              </div>

              <div class="col-12">
                <label class="form-label fw-semibold">Email Address *</label>
                <input type="email" name="email" class="form-control" required placeholder="Email address">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Password *</label>
                <input type="password" name="password1" class="form-control" required placeholder="Create password">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Confirm Password *</label>
                <input type="password" name="password2" class="form-control" required placeholder="Repeat password">
              </div>

              <div class="col-12 mt-4 d-grid">
                <button type="submit" class="btn btn-kpl-primary py-3">Register Account</button>
              </div>

              <div class="col-12 text-center text-muted small mt-3">
                Already registered? <a href="{% url 'accounts:login' %}" class="fw-semibold text-decoration-none">Sign in here</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

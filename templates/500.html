{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<section class="py-5 text-center my-auto">
  <div class="container py-5">
    <h1 class="display-1 fw-bold text-muted">500</h1>
    <h2 class="display-6 fw-semibold mb-3">Something Went Wrong</h2>
    <div class="section-accent-line"></div>
    <p class="lead text-muted max-w-lg mx-auto mb-4">
      We are unable to process your request right now. Please try again later.
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-kpl-primary">
      <i class="bi bi-house-door me-2"></i>Return Home
    </a>
  </div>
</section>
{% endblock %}

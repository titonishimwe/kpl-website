{% extends "base.html" %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<section class="py-5 text-center my-auto">
  <div class="container py-5">
    <h1 class="display-1 fw-bold text-muted">403</h1>
    <h2 class="display-6 fw-semibold mb-3">Access Denied</h2>
    <div class="section-accent-line"></div>
    <p class="lead text-muted max-w-lg mx-auto mb-4">
      You do not have permission to access this resource.
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-kpl-primary">
      <i class="bi bi-house-door me-2"></i>Return Home
    </a>
  </div>
</section>
{% endblock %}
